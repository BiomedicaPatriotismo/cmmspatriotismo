                        <p className="text-xs text-slate-500 mt-4 text-center italic"><i className="fas fa-info-circle"></i> Los equipos "Fuera de Servicio" no penalizan la métrica de Programados.</p>
                    </div>
                </div>
            );
        };

        // ============================================================================
        // [REV-09] MEMBRETE INSTITUCIONAL PARA IMPRESIÓN DE FORMATOS
        // ============================================================================
        const LOGO_HSAIP_URL = ''; // Puedes pegar la cadena base64 de tu logo oficial aquí

        const MembreteHSAIP = ({ titulo, codigo, campos }) => (
            <div className="membrete-hsaip">
                <div className="membrete-logo">
                    {LOGO_HSAIP_URL ? (
                        <img src={LOGO_HSAIP_URL} alt="Hospital San Ángel Inn Patriotismo" />
                    ) : (
                        <React.Fragment>
                            <div className="barra"></div>
                            <div>
                                <div className="caja"><i className="fas fa-hand-sparkles"></i></div>
                                <div className="marca">
                                    <div className="h1">Hospital<sup>®</sup></div>
                                    <div className="h2">San Ángel Inn</div>
                                    <div className="h3">PATRIOTISMO</div>
                                </div>
                            </div>
                        </React.Fragment>
                    )}
                </div>
                <div className="membrete-datos">
                    <p className="razon">Centro Hospitalario Patriotismo, S.A. de C.V.</p>
                    <p>Av. Patriotismo No. 67 Col. San Juan, Alcaldía Benito Juárez</p>
                    <p>C.P. 03730, Ciudad de México</p>
                    <p>Teléfono (55) 47 70 48 70</p>
                    <p>www.hospitalsanangelinn.mx</p>
                    <p>Lic. Sanitaria: 16-AM-09-014-0006</p>
                </div>
                <div className="membrete-titulo">
                    <h1>{titulo}</h1>
                    <p className="codigo">{codigo}</p>
                    {(campos || []).map(([etiqueta, valor]) => (
                        <div className="membrete-campo" key={etiqueta}>
                            <span>{etiqueta}:</span><strong>{valor}</strong>
                        </div>
                    ))}
                </div>
            </div>
        );

        // ============================================================================
        // PROGRAMA DE REVISIÓN SEMANAL (Calendario FOR-INB-008)
        // ============================================================================
        const PROGRAMA_REVISION = {
            diarias: ['QUIROFANO', 'QX', 'CEYE', 'C.E.Y.E', 'HEMODINAMIA', 'HEMO'],
            porDia: {
                0: ['UTIA', 'UTI ', 'IMAGEN', 'IMAGENOLOGIA'],
                1: ['LABORATORIO', 'LABO', '5TO', '5°', 'QUINTO'],
                2: ['TOCO'],
                3: ['URGENCIA', 'URG', 'RESPIRATORIA', 'T.RESP'],
                4: ['ENDOSCOP', 'ENDO', '4TO', '4°', 'CUARTO'],
                5: ['CUNERO', '2DO', '2°', 'SEGUNDO'],
                6: ['UCIN', 'UCI']
            }
        };

        const normalizarTexto = (t) => String(t || '')
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .toUpperCase().trim();

        const detectarFrecuenciaArea = (area) => {
            const a = normalizarTexto(area);
            if (!a) return null;
            if (PROGRAMA_REVISION.diarias.some(f => a.includes(normalizarTexto(f)))) return 'D';
            for (const dia of Object.keys(PROGRAMA_REVISION.porDia)) {
                if (PROGRAMA_REVISION.porDia[dia].some(f => a.includes(normalizarTexto(f)))) return parseInt(dia, 10);
            }
            return null;
        };

        const NOMBRES_DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
        const LETRAS_DIAS = ['D', 'L', 'M', 'Mi', 'J', 'V', 'S'];
        const NOMBRES_MESES_LARGOS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

        const diasProgramados = (mesStr, frecuencia) => {
            const [anio, mes] = String(mesStr || '').split('-').map(n => parseInt(n, 10));
            if (!anio || !mes) return [];
            const total = new Date(anio, mes, 0).getDate();
            const dias = [];
            for (let d = 1; d <= total; d++) {
                if (frecuencia === 'D' || new Date(anio, mes - 1, d).getDay() === frecuencia) dias.push(d);
            }
            return dias;
        };

        // ============================================================================
        // PANTALLA DE ACCESO
        // ============================================================================
        const PantallaAcceso = ({ onAcceso }) => {
            const [pin, setPin] = useState('');
            const [verificando, setVerificando] = useState(false);
            const [errorAcceso, setErrorAcceso] = useState(null);

            const entrar = async (e) => {
                e.preventDefault();
                const limpio = pin.trim();
                if (!limpio) { setErrorAcceso('Escribe tu PIN de acceso.'); return; }
                setVerificando(true);
                setErrorAcceso(null);
                try {
                    const resp = await jsonpRequest({ action: 'login', pin: limpio });
                    if (resp && resp.ok && resp.usuario) {
                        onAcceso(limpio, resp.usuario);
                    } else {
                        setErrorAcceso('Respuesta inesperada del servidor.');
                    }
                } catch (err) {
                    const msg = String(err.message || '');
                    setErrorAcceso(msg.indexOf('ACCESO_DENEGADO') > -1
                        ? 'PIN incorrecto. El intento quedó registrado en la bitácora de accesos.'
                        : 'No se pudo verificar el acceso: ' + msg);
                } finally {
                    setVerificando(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4 font-sans">
                    <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 animate-in fade-in zoom-in-95 duration-300">
                        <div className="flex flex-col items-center mb-6">
                            <div className="bg-blue-500 p-3 rounded-xl w-14 h-14 flex items-center justify-center mb-4 shadow-lg shadow-blue-500/20">
                                <i className="fas fa-thermometer-half text-white text-2xl"></i>
                            </div>
                            <h1 className="text-2xl font-bold text-white tracking-tight">MediCMMS</h1>
                            <p className="text-xs text-slate-400 mt-1">Ingeniería Biomédica · HSAIP</p>
                        </div>

                        <form onSubmit={entrar} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
                                    <i className="fas fa-key mr-2 text-blue-400"></i>PIN de acceso
                                </label>
                                <input
                                    type="password"
                                    value={pin}
                                    onChange={(e) => setPin(e.target.value)}
                                    autoFocus
                                    autoComplete="current-password"
                                    placeholder="••••••••"
                                    className="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-lg text-white text-center text-lg tracking-widest outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition"
                                />
                            </div>

                            {errorAcceso && (
                                <div className="bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-sm text-red-300 flex items-start gap-2">
                                    <i className="fas fa-triangle-exclamation mt-0.5"></i>
                                    <span>{errorAcceso}</span>
                                </div>
                            )}

                            <button type="submit" disabled={verificando}
                                className="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-blue-600/20 disabled:opacity-50 disabled:cursor-not-allowed">
                                {verificando
                                    ? (<><i className="fas fa-circle-notch fa-spin"></i> Verificando...</>)
                                    : (<><i className="fas fa-right-to-bracket"></i> Entrar</>)}
                            </button>
                        </form>

                        <p className="text-[11px] text-slate-500 mt-6 text-center leading-relaxed">
                            <i className="fas fa-shield-halved mr-1"></i>
                            Cada intento de acceso queda registrado con fecha, hora y resultado.
                        </p>
                    </div>
                </div>
            );
        };

        // ============================================================================
        // EXPEDIENTE DIGITAL DEL EQUIPO (Google Drive)
        // ============================================================================
        const TIPOS_ORDEN = {
            OSMP: { label: 'Preventivo',  icono: 'fa-calendar-check', clase: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
            OSMC: { label: 'Correctivo',  icono: 'fa-screwdriver-wrench', clase: 'bg-red-100 text-red-800 border-red-300' },
            OSI:  { label: 'Instalación', icono: 'fa-plug', clase: 'bg-blue-100 text-blue-800 border-blue-300' },
            OSB:  { label: 'Baja',        icono: 'fa-box-archive', clase: 'bg-gray-200 text-gray-700 border-gray-300' },
            OSA:  { label: 'Asistencia',  icono: 'fa-headset', clase: 'bg-amber-100 text-amber-800 border-amber-300' }
        };

        const ExpedienteEquipo = ({ equipo }) => {
            const [docs, setDocs] = useState(null);
            const [cargandoDocs, setCargandoDocs] = useState(true);
            const [errorDocs, setErrorDocs] = useState(null);
            const [filtroTipo, setFiltroTipo] = useState('TODAS');
            const [visor, setVisor] = useState(null);

            const cargarExpediente = async (forzar) => {
                if (!equipo.numeroInventario) {
                    setErrorDocs('Este registro no tiene número de inventario; no es posible localizar su carpeta en Drive.');
                    setCargandoDocs(false);
                    return;
                }
                if (!forzar && CACHE_EXPEDIENTES.has(equipo.numeroInventario)) {
                    setDocs(CACHE_EXPEDIENTES.get(equipo.numeroInventario));
                    setErrorDocs(null);
                    setCargandoDocs(false);
                    return;
                }
                setCargandoDocs(true);
                setErrorDocs(null);
                try {
                    const r = await jsonpConReintentos({
                        action: 'getDocumentosEquipo',
                        inventario: equipo.numeroInventario,
                        refrescar: forzar ? '1' : '0'
                    });
                    setDocs(r);
                    if (r && r.encontrada) CACHE_EXPEDIENTES.set(equipo.numeroInventario, r);
                } catch (err) {
                    setErrorDocs(err.message || 'No se pudo consultar el expediente en Drive.');
                } finally {
                    setCargandoDocs(false);
                }
            };

            useEffect(() => {
                setDocs(null);
                setFiltroTipo('TODAS');
                cargarExpediente();
                return () => setVisor(v => { if (v && v.url) URL.revokeObjectURL(v.url); return null; });
            }, [equipo.numeroInventario]);

            const abrirDocumento = async (archivo) => {
                setVisor({ nombre: archivo.nombre, cargando: true });
                try {
                    const r = await jsonpRequest({ action: 'getArchivo', id: archivo.id }, 60000);
                    if (r && r.ok && r.base64) {
                        const bin = atob(r.base64);
                        const bytes = new Uint8Array(bin.length);
                        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                        const blob = new Blob([bytes], { type: r.mime || 'application/octet-stream' });
                        setVisor({ nombre: r.nombre, url: URL.createObjectURL(blob), mime: r.mime || '' });
                    } else {
                        setVisor(null);
                        if (r && r.motivo) alert(r.motivo);
                        window.open((r && r.url) || archivo.url, '_blank');
                    }
                } catch (err) {
                    setVisor(null);
                    window.open(archivo.url, '_blank');
                }
            };

            const cerrarVisor = () => {
                setVisor(v => { if (v && v.url) URL.revokeObjectURL(v.url); return null; });
            };

            const conteosPorTipo = useMemo(() => {
                const c = { TODAS: 0, OSMP: 0, OSMC: 0, OSI: 0, OSB: 0, OSA: 0 };
                ((docs && docs.ordenes) || []).forEach(o => {
                    c.TODAS++;
                    if (c[o.tipo] !== undefined) c[o.tipo]++;
                });
                return c;
            }, [docs]);

            const ordenesVisibles = useMemo(() => {
                const lista = (docs && docs.ordenes) || [];
                return filtroTipo === 'TODAS' ? lista : lista.filter(o => o.tipo === filtroTipo);
            }, [docs, filtroTipo]);

            const FilaDocumento = ({ archivo, mostrarTipo }) => {
                const t = TIPOS_ORDEN[archivo.tipo];
                return (
                    <tr className="border-b border-gray-50 hover:bg-blue-50/40 transition text-sm">
                        {mostrarTipo && (
                            <td className="p-3 whitespace-nowrap">
                                <span className={`px-2.5 py-1 rounded-lg border font-bold text-[11px] uppercase tracking-wider ${t ? t.clase : 'bg-gray-100 text-gray-600 border-gray-200'}`}>
                                    <i className={`fas ${t ? t.icono : 'fa-file'} mr-1.5`}></i>{t ? t.label : archivo.tipo}
                                </span>
                            </td>
                        )}
                        <td className="p-3 whitespace-nowrap font-bold text-gray-700">
                            {archivo.fecha
                                ? (<span>{archivo.fecha}{archivo.hora && <span className="ml-1.5 text-gray-400 font-medium text-xs"><i className="far fa-clock mr-0.5"></i>{archivo.hora}</span>}</span>)
                                : <span className="text-gray-400 font-normal italic">Sin fecha</span>}
                        </td>
                        <td className="p-3 text-gray-600 max-w-[320px] truncate" title={archivo.nombre}>{archivo.nombre}</td>
                        <td className="p-3 whitespace-nowrap text-right">
                            <button onClick={() => abrirDocumento(archivo)}
                                className="inline-flex items-center gap-1.5 bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700 transition text-xs font-bold shadow-sm">
                                <i className="fas fa-eye"></i> Ver
                            </button>
                            <a href={archivo.url} target="_blank" rel="noopener noreferrer" title="Abrir en Google Drive"
                                className="inline-flex items-center gap-1.5 ml-2 border border-gray-200 text-gray-500 px-3 py-1.5 rounded-lg hover:bg-gray-50 hover:text-gray-700 transition text-xs font-bold">
                                <i className="fab fa-google-drive"></i>
                            </a>
                        </td>
                    </tr>
                );
            };

            return (
                <div>
                    <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                        <p className="text-xs text-gray-400 font-bold uppercase tracking-wider">
                            <i className="fas fa-folder-open mr-2"></i>Expediente Digital · Historial de Mantenimientos
                            {docs && docs.encontrada && (
                                <span className="ml-2 text-[10px] normal-case font-medium text-gray-400">Carpeta: {docs.carpeta}</span>
                            )}
                        </p>
                        <div className="flex flex-wrap gap-2 print-hidden">
                            {docs && docs.encontrada && docs.carpetaUrl && (
                                <a href={docs.carpetaUrl} target="_blank" rel="noopener noreferrer"
                                    className="flex items-center gap-2 border border-gray-200 text-gray-600 px-4 py-2 rounded-lg hover:bg-gray-50 transition shadow-sm font-medium text-sm">
                                    <i className="fab fa-google-drive"></i> Abrir carpeta
                                </a>
                            )}
                            <button onClick={() => cargarExpediente(true)} disabled={cargandoDocs}
                                className="flex items-center gap-2 bg-slate-700 text-white px-4 py-2 rounded-lg hover:bg-slate-800 transition shadow-sm font-medium text-sm disabled:opacity-40">
                                <i className={`fas fa-sync-alt ${cargandoDocs ? 'fa-spin' : ''}`}></i> Actualizar
                            </button>
                        </div>
                    </div>

                    {cargandoDocs && (
                        <div className="bg-gray-50 border border-gray-200 rounded-lg p-8 text-center text-gray-400 text-sm">
                            <i className="fas fa-circle-notch fa-spin mr-2"></i> Consultando la carpeta del equipo en Google Drive...
                        </div>
                    )}

                    {!cargandoDocs && errorDocs && (
                        <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded-lg text-sm text-red-700">
                            <p className="font-bold mb-1">No se pudo consultar el expediente</p>
                            <p>{errorDocs}</p>
                        </div>
                    )}

                    {!cargandoDocs && !errorDocs && docs && !docs.encontrada && (
                        <div className="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-lg text-sm text-amber-800">
                            <p className="font-bold mb-1"><i className="fas fa-folder-minus mr-2"></i>Carpeta no localizada en Drive</p>
                            <p>{docs.mensaje}</p>
                        </div>
                    )}

                    {!cargandoDocs && !errorDocs && docs && docs.encontrada && (
                        <div className="space-y-4">
                            {docs.manuales.length > 0 && (
                                <div className="flex flex-wrap items-center gap-2">
                                    <span className="text-xs font-bold text-gray-500 uppercase tracking-wider mr-1"><i className="fas fa-book mr-1"></i> Manuales:</span>
                                    {docs.manuales.map(m => (
                                        <button key={m.id} onClick={() => abrirDocumento(m)} title={m.nombre}
                                            className="inline-flex items-center gap-2 bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition text-xs font-bold max-w-[260px]">
                                            <i className="fas fa-book-open"></i><span className="truncate">{m.nombre}</span>
                                        </button>
                                    ))}
                                </div>
                            )}

                            <div className="flex flex-wrap gap-2 print-hidden">
                                {['TODAS', 'OSMP', 'OSMC', 'OSI', 'OSB', 'OSA'].map(t => {
                                    const activo = filtroTipo === t;
                                    const etiqueta = t === 'TODAS' ? 'Todas' : (TIPOS_ORDEN[t] ? TIPOS_ORDEN[t].label : t);
                                    return (
                                        <button key={t} onClick={() => setFiltroTipo(t)} disabled={t !== 'TODAS' && conteosPorTipo[t] === 0}
                                            className={`px-3 py-1.5 rounded-full text-xs font-bold border transition disabled:opacity-30 disabled:cursor-not-allowed ${activo ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-gray-600 border-gray-200 hover:border-blue-300 hover:text-blue-600'}`}>
                                            {etiqueta} <span className={activo ? 'text-blue-100' : 'text-gray-400'}>({conteosPorTipo[t]})</span>
                                        </button>
                                    );
                                })}
                            </div>

                            <div className="border border-gray-200 rounded-lg overflow-hidden">
                                <div className="overflow-x-auto max-h-80 overflow-y-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead className="sticky top-0">
                                            <tr className="bg-gray-50 text-gray-500 text-[11px] uppercase tracking-wider">
                                                <th className="p-3 font-bold border-b">Tipo</th>
                                                <th className="p-3 font-bold border-b">Fecha</th>
                                                <th className="p-3 font-bold border-b">Orden de Servicio</th>
                                                <th className="p-3 font-bold border-b text-right">Documento</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {ordenesVisibles.length === 0 ? (
                                                <tr><td colSpan="4" className="p-6 text-center text-gray-400 text-sm italic">
                                                    {conteosPorTipo.TODAS === 0
                                                        ? 'La carpeta no contiene órdenes de servicio reconocibles (prefijo OSMP / OSMC / OSI / OSB / OSA).'
                                                        : 'No hay órdenes de este tipo.'}
                                                </td></tr>
                                            ) : (
                                                ordenesVisibles.map(o => <FilaDocumento key={o.id} archivo={o} mostrarTipo={true} />)
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {docs.otros.length > 0 && (
                                <details className="text-sm">
                                    <summary className="cursor-pointer text-gray-500 font-medium hover:text-gray-700 select-none">
                                        <i className="fas fa-paperclip mr-1"></i> Otros documentos de la carpeta ({docs.otros.length})
                                    </summary>
                                    <div className="mt-2 flex flex-wrap gap-2">
                                        {docs.otros.map(a => (
                                            <button key={a.id} onClick={() => abrirDocumento(a)} title={a.nombre}
                                                className="inline-flex items-center gap-2 bg-gray-50 text-gray-600 border border-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-100 transition text-xs font-medium max-w-[260px]">
                                                <i className="fas fa-file"></i><span className="truncate">{a.nombre}</span>
                                            </button>
                                        ))}
                                    </div>
                                </details>
                            )}
                        </div>
                    )}

                    {visor && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50 print-hidden" onClick={cerrarVisor}>
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-5xl h-[88vh] flex flex-col overflow-hidden animate-in zoom-in-95 duration-200"
                                onClick={(e) => e.stopPropagation()}>
                                <div className="px-5 py-3 border-b border-gray-100 flex justify-between items-center gap-3 bg-gray-50">
                                    <p className="font-bold text-gray-800 text-sm truncate" title={visor.nombre}>
                                        <i className="fas fa-file-lines mr-2 text-blue-500"></i>{visor.nombre}
                                    </p>
                                    <div className="flex items-center gap-2">
                                        {visor.url && (
                                            <a href={visor.url} download={visor.nombre}
                                                className="text-xs font-bold text-blue-600 border border-blue-200 bg-blue-50 px-3 py-1.5 rounded-lg hover:bg-blue-100 transition">
                                                <i className="fas fa-download mr-1"></i> Descargar
                                            </a>
                                        )}
                                        <button onClick={cerrarVisor} className="text-gray-400 hover:text-gray-700 text-xl font-bold px-2">✕</button>
                                    </div>
                                </div>
                                <div className="flex-1 bg-gray-100 flex items-center justify-center overflow-hidden">
                                    {visor.cargando ? (
                                        <div className="text-gray-500 text-sm flex flex-col items-center gap-3">
                                            <i className="fas fa-circle-notch fa-spin text-3xl text-blue-500"></i>
                                            Descargando documento del expediente...
                                        </div>
                                    ) : String(visor.mime).indexOf('image/') === 0 ? (
                                        <img src={visor.url} alt={visor.nombre} className="max-w-full max-h-full object-contain" />
                                    ) : String(visor.mime).indexOf('pdf') > -1 ? (
                                        <iframe src={visor.url} title={visor.nombre} className="w-full h-full border-0"></iframe>
                                    ) : (
                                        <div className="text-center text-gray-500 text-sm p-8">
                                            <i className="fas fa-file-circle-question text-4xl text-gray-300 mb-3"></i>
                                            <p>Este formato no tiene vista previa integrada.</p>
                                            <a href={visor.url} download={visor.nombre} className="text-blue-600 font-bold hover:underline mt-2 inline-block">
                                                Descargar {visor.nombre}
                                            </a>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ============================================================================
        // LÓGICA PRINCIPAL CMMS (INVENTARIO Y CALENDARIOS)
        // ============================================================================
        const CMMSHospitalario = () => {
          const [activeTab, setActiveTab] = useState('dashboard');
          const [inventarioTab, setInventarioTab] = useState('Propio');
          const [equipos, setEquipos] = useState([]);
          const [isSyncing, setIsSyncing] = useState(false);
          const [syncError, setSyncError] = useState(null);
          const [ultimaSync, setUltimaSync] = useState(null);
          const [bitacora, setBitacora] = useState([]);
          const [indicadores, setIndicadores] = useState([]);
          const [usuarioActivo, setUsuarioActivo] = useState(SESION.usuario);

          const [predMes, setPredMes] = useState(() => {
            const h = new Date();
            return h.getFullYear() + '-' + String(h.getMonth() + 1).padStart(2, '0');
          });
          const [predArea, setPredArea] = useState('');
          const [predOrigen, setPredOrigen] = useState('Todos');
          const [predFrecuencia, setPredFrecuencia] = useState('D');
          const [predDatos, setPredDatos] = useState({});   
          const [predCargando, setPredCargando] = useState(false);
          
          const [tecnicoActivo, setTecnicoActivo] = useState(() => {
            try { return window.localStorage.getItem('cmms_tecnico') || ''; } catch (e) { return ''; }
          });
          
          useEffect(() => {
            try { window.localStorage.setItem('cmms_tecnico', tecnicoActivo); } catch (e) {}
          }, [tecnicoActivo]);
          
          const [showAddEquipo, setShowAddEquipo] = useState(false);
          const [searchTerm, setSearchTerm] = useState('');
          const [filterEstatus, setFilterEstatus] = useState('Todos');
          const [filterUbicacion, setFilterUbicacion] = useState('Todas');
          const [paginaActual, setPaginaActual] = useState(0);
          
          const [filterUbicacionCal, setFilterUbicacionCal] = useState('Todas');
          const [filterMesCal, setFilterMesCal] = useState('Todos');
          const [searchControlCal, setSearchControlCal] = useState('');
          const [calendarYear, setCalendarYear] = useState(new Date().getFullYear());

          const [selectedEquipo, setSelectedEquipo] = useState(null);
          const [isEditing, setIsEditing] = useState(false);
          const [equipoEditado, setEquipoEditado] = useState(null);
          
          const estadoInicialEquipo = {
            origen: inventarioTab, numero: '', numeroInventario: '', estatus: 'En Servicio', motivoFueraServicio: '', nombre: '', marca: '', polizaMantenimiento: 'NO', modelo: '', numeroSerie: '', fabricante: '', nivelRiesgo: 'I', ubicacion: '', fechaAlta: '', proveedorMantenimiento: '', descripcion: '', tipoTecnologia: 'Equipo Médico', frecuenciaMantenimiento: '', ultimoMantenimiento: '', proximoMantenimiento: '', historialEjecuciones: ''
          };
          const [nuevoEquipo, setNuevoEquipo] = useState(estadoInicialEquipo);

          useEffect(() => {
            if (!usuarioActivo) return;
            const cacheado = CACHE_LOCAL.leer();
            if (cacheado && cacheado.datos) {
              setEquipos(cacheado.datos.equipos || []);
              setIndicadores(cacheado.datos.indicadores || []);
              setBitacora(cacheado.datos.bitacora || []);
              if (cacheado.datos.ultimaSync) setUltimaSync(cacheado.datos.ultimaSync + ' (guardado en este equipo)');
            }
            handleSyncSheets();
          }, [usuarioActivo]);

          const esAccesoDenegado = (err) =>
            String((err && err.message) || '').indexOf('ACCESO_DENEGADO') > -1;

          const cerrarSesion = () => {
            SESION.limpiar();
            CACHE_LOCAL.limpiar();       
            CACHE_EXPEDIENTES.clear();
            setUsuarioActivo('');
            setEquipos([]);
            setIndicadores([]);
            setBitacora([]);
            setSelectedEquipo(null);
            setSyncError(null);
          };

          const equiposFiltrados = useMemo(() => {
            return equipos.filter(e => {
              const matchHoja = e.origen === inventarioTab;
              const matchEstatus = filterEstatus === 'Todos' ||
                (filterEstatus === 'Fuera de Servicio' ? estaFueraServicio(e) : estaEnServicio(e));
              const matchUbicacion = filterUbicacion === 'Todas' || e.ubicacion === filterUbicacion;
              if (!searchTerm) return matchHoja && matchEstatus && matchUbicacion;
              const s = searchTerm.toLowerCase();
              return matchHoja && matchEstatus && matchUbicacion && (
                String(e.nombre || '').toLowerCase().includes(s) || String(e.numeroInventario || '').toLowerCase().includes(s) || String(e.marca || '').toLowerCase().includes(s) || String(e.numeroSerie || '').toLowerCase().includes(s)
              );
            });
          }, [equipos, inventarioTab, searchTerm, filterEstatus, filterUbicacion]);

          const totalPaginasInventario = Math.max(1, Math.ceil(equiposFiltrados.length / INVENTARIO_PAGE_SIZE));
          const paginaSegura = Math.min(paginaActual, totalPaginasInventario - 1);
          const equiposPagina = useMemo(() => {
              const inicio = paginaSegura * INVENTARIO_PAGE_SIZE;
              return equiposFiltrados.slice(inicio, inicio + INVENTARIO_PAGE_SIZE);
          }, [equiposFiltrados, paginaSegura]);

          const ubicacionesUnicas = useMemo(() => {
              const locs = equipos.filter(e => e.origen === inventarioTab).map(e => e.ubicacion).filter(u => u && u.trim() !== '');
              return ['Todas', ...Array.from(new Set(locs)).sort((a, b) => a.localeCompare(b, 'es'))];
          }, [equipos, inventarioTab]);

          const siguienteFolioPreview = useMemo(
              () => previsualizarSiguienteFolio(nuevoEquipo.origen, equipos),
              [nuevoEquipo.origen, equipos]
          );

          const equiposCalendario = useMemo(() => {
              return equipos.filter(e => {
                  if (e.origen !== inventarioTab) return false;
                  if (!e.frecuenciaMantenimiento || e.frecuenciaMantenimiento === '') return false;
                  if (esBajaDefinitiva(e)) return false;
                  if (filterUbicacionCal !== 'Todas' && e.ubicacion !== filterUbicacionCal) return false;
                  if (searchControlCal) {
                      const s = searchControlCal.toLowerCase();
                      if (!String(e.numeroInventario || '').toLowerCase().includes(s)) return false;
                  }
                  if (filterMesCal !== 'Todos') {
                      const monthIdx = parseInt(filterMesCal, 10);
                      const programados = obtenerMesesProgramados(e.ultimoMantenimiento, e.frecuenciaMantenimiento, calendarYear);
                      if (!programados.has(monthIdx)) return false;
                  }
                  return true;
              });
          }, [equipos, inventarioTab, filterUbicacionCal, filterMesCal, searchControlCal, calendarYear]);

          const handleSyncSheets = async () => {
            setIsSyncing(true);
            setSyncError(null);
            if (!GOOGLE_SHEETS_WEBAPP_URL) {
              setSyncError('No hay URL de backend configurada.');
              setIsSyncing(false);
              return;
            }
            try {
              const data = await jsonpConReintentos({ action: 'getAll' });
              const procesarHoja = (arr, origen) => (arr || [])
                .filter(e => e.numeroInventario || e.nombre)
                .map(e => ({
                  ...e,
                  origen,
                  id: e.id ? String(e.id) : `${origen}-FILA-${e._fila}`
                }));

              const consolidado = [
                ...procesarHoja(data.propio, 'Propio'),
                ...procesarHoja(data.comodato, 'Comodato'),
                ...procesarHoja(data.renta, 'Renta')
              ];

              setEquipos(consolidado);
              setBitacora(data.bitacora || []);
              setIndicadores(data.indicadores || []); 
              setUltimaSync(data.sincronizado || new Date().toLocaleString('es-MX'));

              CACHE_LOCAL.guardar({
                equipos: consolidado,
                indicadores: data.indicadores || [],
                bitacora: data.bitacora || [],
                ultimaSync: data.sincronizado || ''
              });

              if (consolidado.length === 0) {
                setSyncError('El backend respondió correctamente, pero no devolvió equipos.');
              }
            } catch (error) {
              console.error(error);
              if (esAccesoDenegado(error)) { cerrarSesion(); return; }
              setSyncError(error.message || 'Error desconocido al sincronizar.');
            } finally {
              setIsSyncing(false);
            }
          };

          const directSaveToSheets = async (equipo, estadoPrevio) => {
            if (!GOOGLE_SHEETS_WEBAPP_URL) return false;
            setIsSyncing(true);
            setSyncError(null);
            try {
              await jsonpConReintentos({
                action: 'save',
                payload: JSON.stringify({
                  action: 'edit',
                  data: equipo,
                  sheetName: equipo.origen,
                  originalInventario: equipo.numeroInventario,
                  fila: equipo._fila
                })
              });
              setUltimaSync(new Date().toLocaleString('es-MX'));
              return true;
            } catch (error) {
              if (estadoPrevio) setEquipos(estadoPrevio);
              if (esAccesoDenegado(error)) { cerrarSesion(); return false; }
              setSyncError('No se guardó en Google Sheets: ' + error.message);
              return false;
            } finally {
              setIsSyncing(false);
            }
          };

          const handleUpdateEquipo = async (e) => {
            e.preventDefault();
            const estadoPrevio = equipos;
            setEquipos(equipos.map(eq => eq.id === equipoEditado.id ? equipoEditado : eq));
            setSelectedEquipo(equipoEditado);
            setIsEditing(false);
            await directSaveToSheets(equipoEditado, estadoPrevio);
          };

          const handleAddEquipo = async (e) => {
            e.preventDefault();
            if (!nuevoEquipo.nombre || !nuevoEquipo.ubicacion) {
              setSyncError('El nombre del equipo y el área/ubicación son obligatorios.');
              return;
            }
            if (!nuevoEquipo.nivelRiesgo) {
              setSyncError('Selecciona un nivel de riesgo (I, II o III).');
              return;
            }

            setIsSyncing(true);
            setSyncError(null);
            try {
              const resultado = await jsonpConReintentos({
                action: 'save',
                payload: JSON.stringify({ action: 'add', data: nuevoEquipo, sheetName: nuevoEquipo.origen })
              });
              const folioAsignado = resultado.numeroInventario || siguienteFolioPreview;
              const matchNum = String(folioAsignado).match(/(\d+)\s*$/);
              const equipoGuardar = {
                ...nuevoEquipo,
                numeroInventario: folioAsignado,
                numero: matchNum ? parseInt(matchNum[1], 10) : '',
                id: resultado.id || `INV-${folioAsignado}`
              };
              setEquipos([...equipos, equipoGuardar]);
              setShowAddEquipo(false);
              setNuevoEquipo(estadoInicialEquipo);
              setUltimaSync(new Date().toLocaleString('es-MX'));
            } catch (error) {
              setSyncError('No se pudo dar de alta el equipo: ' + error.message);
            } finally {
              setIsSyncing(false);
            }
          };

          const toggleMantenimientoEjecutado = (equipo, monthIndex, year) => {
              const strY = year.toString();
              const strM = (monthIndex + 1).toString().padStart(2, '0');
              const targetStr = `${strY}-${strM}`;

              let historialArr = limpiarHistorial(equipo.historialEjecuciones);
              if (historialArr.includes(targetStr)) { historialArr = historialArr.filter(h => h !== targetStr); } 
              else { historialArr.push(targetStr); }
              historialArr = [...new Set(historialArr)];

              const ejecutando = historialArr.includes(targetStr);
              const updatedEquipo = { ...equipo, historialEjecuciones: historialArr.join(',') };
              const estadoPrevio = equipos;
              setEquipos(equipos.map(eq => eq.id === updatedEquipo.id ? updatedEquipo : eq));

              directSaveToSheets(updatedEquipo, estadoPrevio).then(ok => {
                if (ok && ejecutando) {
                  jsonpConReintentos({
                    action: 'save',
                    payload: JSON.stringify({
                      action: 'bitacora',
                      data: {
                        numeroInventario: equipo.numeroInventario,
                        nombreEquipo: equipo.nombre,
                        origen: equipo.origen,
                        ubicacion: equipo.ubicacion,
                        tipo: 'MP',
                        periodo: targetStr,
                        tecnico: tecnicoActivo || usuarioActivo || 'No especificado',
                        estatusFinal: 'Concluido'
                      }
                    })
                  }).catch(err => console.error('Bitácora:', err));
                }
              });
          };

          const getEstatusColor = (estatus) => {
            const status = estatus ? estatus.toLowerCase() : '';
            if (status.includes('servicio') && !status.includes('fuera')) return 'bg-emerald-100 text-emerald-800 border-emerald-300';
            if (status.includes('fuera de servicio')) return 'bg-red-100 text-red-800 border-red-300';
            return 'bg-gray-100 text-gray-800 border-gray-300'; 
          };

          const EtiquetaEquipo = ({ equipo }) => {
            const [imgUrl, setImgUrl] = useState(null);
            const [errorEtiqueta, setErrorEtiqueta] = useState(null);

            useEffect(() => {
              let vigente = true;
              setImgUrl(null);
              setErrorEtiqueta(null);
              generarEtiqueta(equipo)
                .then(url => { if (vigente) setImgUrl(url); })
                .catch(err => { if (vigente) setErrorEtiqueta(err.message); });
              return () => { vigente = false; };
            }, [equipo.id, equipo.nombre, equipo.marca, equipo.modelo,
                equipo.numeroSerie, equipo.ubicacion, equipo.numeroInventario]);

            const nombreArchivo = () => {
              const inv = String(equipo.numeroInventario || 'SIN-INV')
                .replace(/[^A-Za-z0-9_-]/g, '');
              return `Etiqueta_${inv}.png`;
            };

            const descargar = () => {
              if (!imgUrl) return;
              const a = document.createElement('a');
              a.href = imgUrl;
              a.download = nombreArchivo();
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
            };

            const imprimir = () => {
              if (!imgUrl) return;
              const v = window.open('', '_blank', 'width=900,height=600');
              if (!v) {
                setErrorEtiqueta('El navegador bloqueó la ventana emergente. Permite las ventanas emergentes para imprimir.');
                return;
              }
              v.document.write(
                '<html><head><title>' + nombreArchivo() + '</title>' +
                '<style>' +
                '@page{size:' + ETQ_ANCHO_MM + 'mm ' + ETQ_ALTO_MM + 'mm;margin:0}' +
                'html,body{margin:0;padding:0}' +
                'img{width:' + ETQ_ANCHO_MM + 'mm;height:' + ETQ_ALTO_MM + 'mm;display:block;' +
                'image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges}' +
                '</style></head><body>' +
                '<img src="' + imgUrl + '" onload="window.focus();window.print();window.close();">' +
                '</body></html>'
              );
              v.document.close();
            };

            return (
              <div>
                <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                  <p className="text-xs text-gray-400 font-bold uppercase tracking-wider">
                    <i className="fas fa-tag mr-2"></i>Etiqueta de Identificación
                    <span className="ml-2 text-[10px] normal-case font-medium text-gray-400">
                      {ETQ_ANCHO_MM} × {ETQ_ALTO_MM} mm · Zebra 300 dpi
                    </span>
                  </p>
                  <div className="flex flex-wrap gap-2 print-hidden">
                    <button onClick={descargar} disabled={!imgUrl}
                      className="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition shadow-sm font-medium text-sm disabled:opacity-40 disabled:cursor-not-allowed">
                      <i className="fas fa-download"></i> Descargar PNG
                    </button>
                    <button onClick={imprimir} disabled={!imgUrl}
                      className="flex items-center gap-2 bg-slate-700 text-white px-4 py-2 rounded-lg hover:bg-slate-800 transition shadow-sm font-medium text-sm disabled:opacity-40 disabled:cursor-not-allowed">
                      <i className="fas fa-print"></i> Imprimir
                    </button>
                  </div>
                </div>

                {errorEtiqueta && (
                  <div className="bg-red-50 border-l-4 border-red-500 p-3 rounded-lg text-sm text-red-700">
                    {errorEtiqueta}
                  </div>
                )}

                <div className="bg-gray-50 p-4 rounded-lg border border-gray-200 flex justify-center shadow-inner">
                  {imgUrl ? (
                    <img src={imgUrl} alt={'Etiqueta ' + (equipo.numeroInventario || '')}
                      className="h-auto rounded shadow-md border border-gray-300 bg-white"
                      style={{ width: '380px', maxWidth: '100%' }} />
                  ) : !errorEtiqueta ? (
                    <div className="py-12 text-gray-400 text-sm flex items-center gap-2">
                      <i className="fas fa-circle-notch fa-spin"></i> Generando etiqueta...
                    </div>
                  ) : null}
                </div>

                <p className="text-[11px] text-gray-400 mt-2 text-center">
                  El código QR dirige a la base de datos de equipos del CMMS.
                  Al imprimir, configura el driver Zebra en <strong>100% de escala</strong> (sin «ajustar a página»).
                </p>
              </div>
            );
          };

          const BannerEstado = () => {
            if (syncError) {
              return (
                <div className="print-hidden bg-red-50 border-l-4 border-red-500 p-4 rounded-lg flex items-start gap-3">
                  <i className="fas fa-triangle-exclamation text-red-600 mt-1"></i>
                  <div className="flex-1">
                    <p className="font-bold text-red-800 text-sm">Error de sincronización</p>
                    <p className="text-red-700 text-sm mt-1">{syncError}</p>
                  </div>
                  <button onClick={handleSyncSheets} className="text-sm bg-red-600 text-white px-3 py-1.5 rounded-lg hover:bg-red-700 font-medium whitespace-nowrap">Reintentar</button>
                </div>
              );
            }
            if (equipos.length > 0) {
              return (
                <div className="print-hidden bg-emerald-50 border-l-4 border-emerald-500 p-3 rounded-lg flex items-center gap-3 text-sm">
                  <i className="fas fa-circle-check text-emerald-600"></i>
                  <span className="text-emerald-800 font-medium">
                    {equipos.length} equipos sincronizados{ultimaSync ? ` · ${ultimaSync}` : ''}
                  </span>
                </div>
              );
            }
            return null;
          };

          const areasPredictivos = useMemo(() => {
            const base = equipos.filter(e =>
              (predOrigen === 'Todos' || e.origen === predOrigen) && !estaFueraServicio(e));
            return Array.from(new Set(base.map(e => e.ubicacion).filter(u => u && u.trim() !== '')))
              .sort((a, b) => a.localeCompare(b, 'es'));
          }, [equipos, predOrigen]);

          const equiposPredictivos = useMemo(() => {
            if (!predArea) return [];
            return equipos
              .filter(e => e.ubicacion === predArea &&
                           (predOrigen === 'Todos' || e.origen === predOrigen) &&
                           !estaFueraServicio(e))
              .sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es'));
          }, [equipos, predArea, predOrigen]);

          const excluidosPredictivos = useMemo(() => {
            if (!predArea) return [];
            return equipos.filter(e => e.ubicacion === predArea &&
                                       (predOrigen === 'Todos' || e.origen === predOrigen) &&
                                       estaFueraServicio(e));
          }, [equipos, predArea, predOrigen]);

          useEffect(() => {
            if (!predArea) return;
            const f = detectarFrecuenciaArea(predArea);
            setPredFrecuencia(f === null ? 'D' : f);
          }, [predArea]);

          useEffect(() => {
            if (!predArea || !predMes || !usuarioActivo) { setPredDatos({}); return; }
            let cancelado = false;
            (async () => {
              setPredCargando(true);
              try {
                const r = await jsonpConReintentos({ action: 'getPredictivos', mes: predMes, area: predArea });
                if (cancelado) return;
                const mapa = {};
                (r.predictivos || []).forEach(p => { mapa[p.inventario] = { dias: p.dias || {}, obs: p.obs || '' }; });
                setPredDatos(mapa);
              } catch (err) {
                if (cancelado) return;
                if (esAccesoDenegado(err)) { cerrarSesion(); return; }
                setSyncError('No se pudieron cargar las revisiones: ' + err.message);
              } finally {
                if (!cancelado) setPredCargando(false);
              }
            })();
            return () => { cancelado = true; };
          }, [predArea, predMes, usuarioActivo]);

          const guardarPredictivo = (equipo, cambios) => jsonpConReintentos({
            action: 'save',
            payload: JSON.stringify({
              action: 'predictivo',
              mes: predMes,
              area: predArea,
              data: {
                inventario: equipo.numeroInventario,
                nombre: equipo.nombre || '',
                marca: equipo.marca || '',
                modelo: equipo.modelo || '',
                serie: equipo.numeroSerie || '',
                ...cambios
              }
            })
          });

          const ciclarMarcaPredictivo = (equipo, dia) => {
            const inv = equipo.numeroInventario;
            if (!inv) { setSyncError('El equipo no tiene número de inventario; no se puede registrar su revisión.'); return; }
            const actual = ((predDatos[inv] || {}).dias || {})[dia] || '';
            const siguiente = actual === '' ? 'OK' : (actual === 'OK' ? 'F' : '');
            const previo = predDatos;
            
            setPredDatos(prev => {
              const fila = prev[inv] || { dias: {}, obs: '' };
              const dias = { ...fila.dias };
              if (siguiente) dias[dia] = siguiente; else delete dias[dia];
              return { ...prev, [inv]: { ...fila, dias } };
            });
            
            guardarPredictivo(equipo, { dia, valor: siguiente }).catch(err => {
              setPredDatos(previo);
              if (esAccesoDenegado(err)) { cerrarSesion(); return; }
              setSyncError('No se guardó la marca de revisión: ' + err.message);
            });
          };

          const editarObsPredictivo = (inv, texto) => {
            setPredDatos(prev => ({ ...prev, [inv]: { dias: (prev[inv] || {}).dias || {}, obs: texto } }));
          };

          const guardarObsPredictivo = (equipo, texto) => {
            if (!equipo.numeroInventario) return;
            guardarPredictivo(equipo, { obs: texto }).catch(err => {
              if (esAccesoDenegado(err)) { cerrarSesion(); return; }
              setSyncError('No se guardó la observación: ' + err.message);
            });
          };

          const renderPredictivos = () => {
            const [anioP, mesP] = predMes.split('-').map(n => parseInt(n, 10));
            const diasPred = diasProgramados(predMes, predFrecuencia);
            const etiquetaMes = (NOMBRES_MESES_LARGOS[(mesP || 1) - 1] || '') + ' ' + (anioP || '');
            const bloquesDias = [];
            // Agrupación de 10 días para formato vertical (Portrait)
            for (let i = 0; i < diasPred.length; i += 10) bloquesDias.push(diasPred.slice(i, i + 10));

            const marcaDe = (inv, d) => ((predDatos[inv] || {}).dias || {})[d] || '';
            const totalMarcas = equiposPredictivos.reduce((acc, eq) =>
              acc + diasPred.filter(d => marcaDe(eq.numeroInventario, d)).length, 0);
            const totalFallas = equiposPredictivos.reduce((acc, eq) =>
              acc + diasPred.filter(d => marcaDe(eq.numeroInventario, d) === 'F').length, 0);

            return (
              <div className="space-y-6 animate-in fade-in duration-300 text-slate-800">

                  <h2 className="text-2xl font-bold flex items-center gap-2">
                    <i className="fas fa-clipboard-check text-blue-600"></i> Mantenimientos Predictivos
                    <span className="text-sm font-medium text-gray-400 mt-1">Revisión rutinaria · FOR-INB-008</span>
                  </h2>
                  <div className="flex gap-2">
                    <button onClick={() => window.print()} disabled={!predArea}
                      className="flex items-center gap-2 bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition shadow-sm font-medium text-sm disabled:opacity-40">
                      <i className="fas fa-print"></i> Imprimir formato
                    </button>
                  </div>
                </div>

                <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex flex-wrap items-center gap-4 print-hidden">
                  <div className="flex items-center gap-2">
                    <label className="text-xs font-bold text-gray-500 uppercase">Mes:</label>
                    <input type="month" value={predMes} onChange={(e) => e.target.value && setPredMes(e.target.value)}
                      className="py-2 px-3 border border-gray-200 rounded-lg text-sm bg-gray-50 outline-none font-bold" />
                  </div>
                  <div className="flex items-center gap-2">
                    <label className="text-xs font-bold text-gray-500 uppercase">Equipo:</label>
                    <select value={predOrigen} onChange={(e) => setPredOrigen(e.target.value)}
                      className="py-2 px-3 border border-gray-200 rounded-lg text-sm bg-gray-50 outline-none font-medium">
                      {['Todos', 'Propio', 'Comodato', 'Renta'].map(o => <option key={o} value={o}>{o}</option>)}
                    </select>
                  </div>
                  <div className="flex items-center gap-2 flex-1 min-w-[220px]">
                    <label className="text-xs font-bold text-gray-500 uppercase"><i className="fas fa-map-marker-alt mr-1"></i>Área:</label>
                    <select value={predArea} onChange={(e) => setPredArea(e.target.value)}
                      className="w-full py-2 px-3 border border-gray-200 rounded-lg text-sm bg-gray-50 outline-none font-medium">
                      <option value="">— Selecciona un área —</option>
                      {areasPredictivos.map(a => <option key={a} value={a}>{a}</option>)}
                    </select>
                  </div>
                  <div className="flex items-center gap-2">
                    <label className="text-xs font-bold text-gray-500 uppercase" title="Según el Calendario de Revisiones Semanales; puedes ajustarla">Frecuencia:</label>
                    <select value={String(predFrecuencia)} onChange={(e) => setPredFrecuencia(e.target.value === 'D' ? 'D' : parseInt(e.target.value, 10))}
                      className="py-2 px-3 border border-gray-200 rounded-lg text-sm bg-gray-50 outline-none font-medium">
                      <option value="D">Diaria</option>
                      {NOMBRES_DIAS.map((n, i) => <option key={i} value={i}>{n} (semanal)</option>)}
                    </select>
                  </div>
                </div>

                {!predArea ? (
                  <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-12 text-center text-gray-400 print-hidden">
                    <i className="fas fa-map-marker-alt text-5xl text-gray-200 mb-4"></i>

                  </div>
                ) : (

                    <div className="px-4 py-3 border-b border-gray-100 flex flex-wrap items-center justify-between gap-3 bg-gray-50/60">
                      <p className="text-sm font-bold text-gray-700">
                        {predArea} · {etiquetaMes}
                        <span className="ml-3 font-medium text-gray-400">{equiposPredictivos.length} equipos en servicio · {diasPred.length} días programados</span>

                      </p>
                      <div className="flex items-center gap-4 text-xs font-medium text-gray-500">
                        {predCargando && <span><i className="fas fa-circle-notch fa-spin mr-1 text-blue-500"></i> Cargando marcas...</span>}

                      </div>
                    </div>
                    <div className="overflow-x-auto max-h-[65vh] overflow-y-auto">
                      <table className="w-full text-left border-collapse text-xs whitespace-nowrap">
                        <thead className="sticky top-0 z-10">
                          <tr className="bg-gray-100 text-gray-500 uppercase tracking-wider text-[10px]">
                            <th className="p-2 font-bold border-b sticky left-0 bg-gray-100">Equipo</th>
                            <th className="p-2 font-bold border-b">Marca</th>
                            <th className="p-2 font-bold border-b">Modelo</th>
                            <th className="p-2 font-bold border-b">Serie</th>
                            {diasPred.map(d => (
                              <th key={d} className="p-1 font-bold border-b text-center min-w-[34px]">
                                <div>{d}</div>
                                <div className="text-gray-400 font-medium">{LETRAS_DIAS[new Date(anioP, mesP - 1, d).getDay()]}</div>
                              </th>

                            <th className="p-2 font-bold border-b min-w-[220px]">Observaciones</th>
                          </tr>
                        </thead>
                        <tbody>
                          {equiposPredictivos.length === 0 ? (
                            <tr><td colSpan={5 + diasPred.length} className="p-8 text-center text-gray-400 italic">No hay equipos registrados en esta área.</td></tr>

                            const inv = eq.numeroInventario;
                            return (
                              <tr key={eq.id} className="border-b border-gray-50 hover:bg-blue-50/30">
                                <td className="p-2 sticky left-0 bg-white font-bold text-gray-700 max-w-[220px] truncate" title={eq.nombre}>
                                  {eq.nombre}
                                  <span className="block text-[10px] font-medium text-gray-400">{inv}</span>
                                </td>
                                <td className="p-2 text-gray-500">{eq.marca}</td>
                                <td className="p-2 text-gray-500">{eq.modelo}</td>
                                <td className="p-2 text-gray-500">{eq.numeroSerie}</td>
                                {diasPred.map(d => {
                                  const m = marcaDe(inv, d);
                                  return (
                                    <td key={d} className="p-0 text-center border-l border-gray-50">
                                      <button onClick={() => ciclarMarcaPredictivo(eq, d)} title={`Día ${d}: ${m === 'OK' ? 'Revisado, bien' : m === 'F' ? 'Con falla' : 'Sin revisar'}`}
                                        className={`w-full h-9 text-sm font-bold transition ${
                                          m === 'OK' ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200'
                                          : m === 'F' ? 'bg-red-100 text-red-600 hover:bg-red-200'
                                          : 'text-gray-300 hover:bg-blue-50'}`}>
                                        {m === 'OK' ? '✓' : m === 'F' ? '✗' : '·'}
                                      </button>
                                    </td>
                                  );
                                })}
                                <td className="p-1">
                                  <input type="text" value={(predDatos[inv] || {}).obs || ''}
                                    onChange={(e) => editarObsPredictivo(inv, e.target.value)}
                                    onBlur={(e) => guardarObsPredictivo(eq, e.target.value)}
                                    placeholder="Observaciones..."
                                    className="w-full py-1.5 px-2 border border-gray-200 rounded text-xs bg-gray-50 outline-none focus:ring-1 focus:ring-blue-400" />
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* Formato impreso FOR-INB-008 (solo al imprimir) */}
                {predArea && (
                  <div className="hidden print-block">
                    {bloquesDias.map((bloque, idx) => (
                      <div key={idx} className={idx > 0 ? 'salto-pagina' : ''}>
                        <MembreteHSAIP
                          titulo="Programa de Revisión Semanal"
                          codigo="HSAIP-FOR-INB-008 Rev. 01"
                          campos={[
                            ['EQUIPO', predOrigen],
                            ['ÁREA', predArea],
                            ['MES', etiquetaMes]
                          ]}
                        />
                        <table className="tabla-formato">
                          <thead>
                            <tr>
                              <th style={{width: '20%'}}>Equipo</th>
                              <th style={{width: '12%'}}>Marca</th>
                              <th style={{width: '12%'}}>Modelo</th>
                              <th style={{width: '12%'}}>Serie</th>
                              {bloque.map(d => <th key={d}>{d}</th>)}
                            </tr>
                          </thead>
                          <tbody>
                            {equiposPredictivos.map(eq => (
                              <tr key={eq.id}>
                                <td>{eq.nombre}</td>
                                <td>{eq.marca}</td>
                                <td>{eq.modelo}</td>
                                <td>{eq.numeroSerie}</td>
                                {bloque.map(d => {
                                  const m = marcaDe(eq.numeroInventario, d);
                                  return <td key={d} className="centro">{m === 'OK' ? '✓' : m === 'F' ? '✗' : ''}</td>;
                                })}
                              </tr>
                            ))}
                          </tbody>
                        </table>

                        {/* Registro de Revisión (firmas por día del bloque) */}
                        <div style={{ pageBreakInside: 'avoid' }}>
                            <p style={{fontFamily: 'Arial', fontWeight: 700, fontSize: '11px', margin: '15px 0 5px'}}>Registro de Revisión (Firmas)</p>
                            <table className="tabla-formato" style={{width: '100%'}}>
                              <thead>
                                <tr><th style={{width: '20%', padding: '6px'}}>DÍA</th><th style={{width: '40%'}}>RESPONSABLE DEL ÁREA</th><th style={{width: '40%'}}>INGENIERÍA BIOMÉDICA</th></tr>
                              </thead>
                              <tbody>
                                {bloque.map(d => (
                                  <tr key={d}>
                                    <td className="centro" style={{padding: '10px'}}>{String(d).padStart(2, '0')}/{String(mesP).padStart(2, '0')}/{anioP}</td>
                                    <td>&nbsp;</td>
                                    <td>&nbsp;</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                        </div>

                        {/* Observaciones */}
                        <div style={{ pageBreakInside: 'avoid' }}>
                            <p style={{fontFamily: 'Arial', fontWeight: 700, fontSize: '11px', margin: '15px 0 5px'}}>Observaciones Generales</p>
                            <div style={{border: '1px solid #000', minHeight: '80px', padding: '6px', fontFamily: 'Arial', fontSize: '10px'}}>
                              {equiposPredictivos
                                .filter(eq => ((predDatos[eq.numeroInventario] || {}).obs || '').trim() !== '')
                                .map(eq => (
                                  <p key={eq.id} style={{margin: '0 0 4px'}}>
                                    <strong>{eq.nombre} ({eq.numeroInventario}):</strong> {(predDatos[eq.numeroInventario] || {}).obs}
                                  </p>
                                ))}
                            </div>
                        </div>

                        <div className="leyenda-controlado" style={{ marginTop: '15px' }}>DOCUMENTO CONTROLADO. PROHIBIDA SU REPRODUCCIÓN PARCIAL O TOTAL NO AUTORIZADA</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          };

          const renderCalendarios = () => (
              <div className="space-y-6 animate-in fade-in duration-300 text-slate-800">
                  <BannerEstado />
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 print-hidden">
                      <h2 className="text-2xl font-bold flex items-center gap-2">
                        <i className="far fa-calendar-alt text-blue-600"></i> Calendario de Mantenimiento Preventivo
                      </h2>
                      <div className="flex gap-2">
                          <button onClick={() => window.print()} className="flex items-center gap-2 bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition shadow-sm font-medium text-sm">
                            <i className="fas fa-print"></i> Imprimir
                          </button>
                          <button onClick={handleSyncSheets} disabled={isSyncing} className="flex items-center gap-2 bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 transition shadow-sm font-medium text-sm">
                            <i className={`fas fa-sync-alt ${isSyncing ? "fa-spin" : ""}`}></i> {isSyncing ? 'Sincronizando...' : 'Sincronizar Sheets'}
                          </button>
                      </div>
                  </div>

                  <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden" id="area-impresion">
                      <div className="flex border-b border-gray-100 bg-gray-50/50 overflow-x-auto print-hidden">
                        <button onClick={() => setInventarioTab('Propio')} className={`flex-1 py-3 px-4 text-sm font-medium transition-colors border-b-2 whitespace-nowrap ${inventarioTab === 'Propio' ? 'border-blue-600 text-blue-600 bg-white' : 'border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-100'}`}>Hoja 1: Equipo Propio</button>
                        <button onClick={() => setInventarioTab('Comodato')} className={`flex-1 py-3 px-4 text-sm font-medium transition-colors border-b-2 whitespace-nowrap ${inventarioTab === 'Comodato' ? 'border-purple-600 text-purple-600 bg-white' : 'border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-100'}`}>Hoja 2: Comodato</button>
                        <button onClick={() => setInventarioTab('Renta')} className={`flex-1 py-3 px-4 text-sm font-medium transition-colors border-b-2 whitespace-nowrap ${inventarioTab === 'Renta' ? 'border-amber-600 text-amber-600 bg-white' : 'border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-100'}`}>Hoja 3: Renta</button>
                      </div>

                      <div className="p-4 border-b border-gray-100 bg-white flex flex-wrap items-center gap-4 print-hidden">
                          <div className="flex items-center gap-2 flex-1 min-w-[200px]">
                              <label className="text-xs font-bold text-gray-500 uppercase"><i className="fas fa-search mr-1"></i> Control:</label>
                              <input type="text" value={searchControlCal} onChange={(e) => setSearchControlCal(e.target.value)} placeholder="Buscar No. Control..." className="w-full py-2 px-3 border border-gray-200 rounded-lg text-sm bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500 font-medium" />
                          </div>
                          <div className="flex items-center gap-2 flex-1 min-w-[200px]">
                              <label className="text-xs font-bold text-gray-500 uppercase"><i className="fas fa-map-marker-alt mr-1"></i> Área:</label>
                              <select value={filterUbicacionCal} onChange={(e) => setFilterUbicacionCal(e.target.value)} className="w-full py-2 px-3 border border-gray-200 rounded-lg text-sm bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500 font-medium">
                                  {ubicacionesUnicas.map(ub => <option key={ub} value={ub}>{ub}</option>)}
                              </select>
                          </div>
                          <div className="flex items-center gap-2 flex-1 min-w-[150px]">
                              <label className="text-xs font-bold text-gray-500 uppercase"><i className="fas fa-filter mr-1"></i> Mes:</label>
                              <select value={filterMesCal} onChange={(e) => setFilterMesCal(e.target.value)} className="w-full py-2 px-3 border border-gray-200 rounded-lg text-sm bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500 font-medium">
                                  <option value="Todos">Todos los meses</option>

                      <div className="hidden print-block p-4 text-slate-800">
                          <MembreteHSAIP
